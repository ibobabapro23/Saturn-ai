<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon Seti -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Marked.js (Markdown Desteği) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gptBg: '#212121',
                        gptSidebar: '#171717',
                        gptHover: '#2f2f2f',
                        gptInput: '#2f2f2f',
                        saturnAmber: '#f59e0b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #212121;
            color: #ececec;
        }

        /* Özel Kaydırma Çubuğu */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #525252;
        }

        /* Markdown Biçimlendirme */
        .markdown-body p { margin-bottom: 0.75rem; line-height: 1.6; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.75rem; }
        .markdown-body pre {
            background-color: #0d0d0d !important;
            border-radius: 8px;
            padding: 1rem;
            margin: 0.75rem 0;
            overflow-x: auto;
            border: 1px solid #333;
        }
        .markdown-body code {
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
        }

        /* Saturn Logo Halkası */
        .saturn-ring-small {
            position: absolute;
            width: 24px;
            height: 8px;
            border: 2px solid #f59e0b;
            border-radius: 50%;
            transform: rotate(-25deg);
        }
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden">

    <!-- SOL KENAR ÇUBUĞU (SIDEBAR) -->
    <aside id="sidebar" class="w-64 bg-gptSidebar flex flex-col justify-between p-3 border-r border-white/10 transition-all duration-300 z-20 shrink-0">
        <div class="flex flex-col gap-2">
            <!-- Yeni Sohbet Butonu -->
            <button id="newChatBtn" class="flex items-center justify-between w-full px-3 py-2.5 rounded-lg text-sm text-zinc-200 hover:bg-gptHover transition-colors border border-white/10">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-amber-500"></i>
                    <span class="font-medium">Yeni Sohbet</span>
                </div>
                <i class="fa-solid fa-plus text-xs text-zinc-400"></i>
            </button>

            <!-- Geçmiş Liste Başlığı -->
            <div class="mt-4 px-2 text-xs font-semibold text-zinc-500 uppercase tracking-wider">
                Sohbetler
            </div>

            <!-- Geçmiş Listesi -->
            <div id="chatHistoryList" class="flex flex-col gap-1 overflow-y-auto max-h-[calc(100vh-180px)]">
                <button class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-zinc-300 hover:bg-gptHover transition-colors text-left truncate w-full group">
                    <i class="fa-regular fa-message text-zinc-400 group-hover:text-amber-500"></i>
                    <span class="truncate">Saturn AI Genel Sohbet</span>
                </button>
            </div>
        </div>

        <!-- Kullanıcı / Geliştirici Bilgisi -->
        <div class="pt-3 border-t border-white/10 flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center font-bold text-zinc-950 text-xs shadow-md">
                    HG
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-semibold text-zinc-200">Hasan Günbeyi</span>
                    <span class="text-xs text-amber-500 font-medium">Saturn AI Creator</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- SAĞ ANA İÇERİK ALANI -->
    <main class="flex-1 flex flex-col h-full bg-gptBg relative overflow-hidden">

        <!-- ÜST BAR (HEADER) -->
        <header class="h-14 px-4 flex items-center justify-between border-b border-white/5 bg-gptBg/80 backdrop-blur z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button id="toggleSidebar" class="p-2 text-zinc-400 hover:text-white rounded-lg hover:bg-gptHover">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="flex items-center gap-2">
                    <span class="font-bold text-lg tracking-wide text-zinc-100">Saturn AI</span>
                    <span class="text-xs px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">3.1 Instant</span>
                </div>
            </div>

            <!-- Sesli Okuma / TTS Ayarı -->
            <div class="flex items-center gap-2">
                <button id="ttsToggleBtn" title="Sesli Yanıtı Aç/Kapat" class="p-2 text-zinc-400 hover:text-amber-400 rounded-lg hover:bg-gptHover transition-colors">
                    <i id="ttsIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </header>

        <!-- SOHBET AKIŞ ALANI -->
        <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6">
            <div class="max-w-3xl mx-auto space-y-6">

                <!-- KARŞILAMA EKRANI (Boş Sohbet Durumu) -->
                <div id="welcomeScreen" class="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-4">
                    <div class="relative w-16 h-16 flex items-center justify-center bg-gradient-to-tr from-amber-600 to-amber-400 rounded-2xl shadow-xl shadow-amber-500/10">
                        <i class="fa-solid fa-planet text-3xl text-zinc-950"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-zinc-100">Bugün nasıl yardımcı olabilirim?</h2>
                    <p class="text-sm text-zinc-400 max-w-md">
                        Saturn AI, Hasan Günbeyi tarafından geliştirilmiş yüksek hızlı bir yapay zeka asistanıdır.
                    </p>

                    <!-- Örnek İpuçları -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-xl pt-4">
                        <button onclick="sendPrompt('Seni kim geliştirdi?')" class="p-3 text-left bg-zinc-800/50 hover:bg-zinc-800 border border-white/5 rounded-xl text-xs text-zinc-300 transition-colors">
                            <span class="font-semibold block text-amber-400 mb-0.5">Geliştirici Hakkında</span>
                            Seni kim geliştirdi ve ne amaçla tasarlandın?
                        </button>
                        <button onclick="sendPrompt('Bana JavaScript ile bir kronometre kodu yaz.')" class="p-3 text-left bg-zinc-800/50 hover:bg-zinc-800 border border-white/5 rounded-xl text-xs text-zinc-300 transition-colors">
                            <span class="font-semibold block text-amber-400 mb-0.5">Kod Örneği İsteyin</span>
                            JavaScript ile hızlı bir kronometre uygulaması yaz.
                        </button>
                    </div>
                </div>

                <!-- Mesajlar Buraya Dinamik Eklenir -->
                <div id="messageList" class="space-y-6 hidden"></div>

            </div>
        </div>

        <!-- ALT MESAJA GİRİŞ ALANI (CHATGPT STYLE INPUT) -->
        <footer class="p-4 bg-gptBg border-t border-white/5 shrink-0">
            <div class="max-w-3xl mx-auto space-y-2">
                <div class="relative flex items-center bg-gptInput border border-white/10 rounded-2xl p-2 shadow-lg focus-within:border-white/20 transition-all">
                    
                    <!-- Sesli Giriş (Mikrofon) -->
                    <button id="micBtn" title="Sesli Konuş" class="p-2.5 text-zinc-400 hover:text-amber-400 rounded-xl hover:bg-zinc-700/50 transition-colors shrink-0">
                        <i id="micIcon" class="fa-solid fa-microphone"></i>
                    </button>

                    <!-- Textarea Girdi Kutusu -->
                    <textarea id="userInput" rows="1" placeholder="Saturn AI'a bir mesaj yazın..."
                        class="w-full bg-transparent text-zinc-100 px-3 py-1.5 focus:outline-none resize-none text-sm placeholder-zinc-500 max-h-36 leading-relaxed"></textarea>

                    <!-- Gönder Butonu -->
                    <button id="sendBtn" class="p-2.5 bg-amber-500 hover:bg-amber-600 text-zinc-950 font-bold rounded-xl transition-all shrink-0 disabled:opacity-40">
                        <i class="fa-solid fa-arrow-up text-base"></i>
                    </button>
                </div>

                <!-- Alt Dipnot -->
                <p class="text-[11px] text-center text-zinc-500">
                    Saturn AI hata yapabilir. Önemli bilgileri kontrol edin. • Hasan Günbeyi
                </p>
            </div>
        </footer>

    </main>

    <script>
        // DOM Elemanları
        const sidebar = document.getElementById('sidebar');
        const toggleSidebar = document.getElementById('toggleSidebar');
        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageList = document.getElementById('messageList');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const ttsToggleBtn = document.getElementById('ttsToggleBtn');
        const ttsIcon = document.getElementById('ttsIcon');
        const newChatBtn = document.getElementById('newChatBtn');

        let chatHistory = [];
        let ttsEnabled = true;
        let isRecognizing = false;
        let recognition = null;

        // Sidebar Aç/Kapat
        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('-ml-64');
        });

        // Metin Kutusu Otomatik Yükseklik Ayarı
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Speech Recognition (Sesli Konuşma)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';

            recognition.onstart = () => {
                isRecognizing = true;
                micIcon.className = "fa-solid fa-circle-stop text-red-500 animate-pulse";
            };

            recognition.onend = () => {
                isRecognizing = false;
                micIcon.className = "fa-solid fa-microphone text-zinc-400";
            };

            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                sendMessage();
            };

            micBtn.addEventListener('click', () => {
                if (isRecognizing) recognition.stop();
                else recognition.start();
            });
        } else {
            micBtn.style.display = 'none';
        }

        // Text-to-Speech Toggle
        ttsToggleBtn.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            ttsIcon.className = ttsEnabled ? "fa-solid fa-volume-high text-amber-400" : "fa-solid fa-volume-xmark text-zinc-500";
            if (!ttsEnabled) window.speechSynthesis.cancel();
        });

        // Yeni Sohbet
        newChatBtn.addEventListener('click', () => {
            chatHistory = [];
            messageList.innerHTML = '';
            messageList.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
        });

        // Enter ile Gönder
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function sendPrompt(text) {
            userInput.value = text;
            sendMessage();
        }

        // Mesaj Gönderimi
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (welcomeScreen.classList.contains('hidden') === false) {
                welcomeScreen.classList.add('hidden');
                messageList.classList.remove('hidden');
            }

            // Kullanıcı Mesajını Ekle
            appendUserMessage(text);
            chatHistory.push({ role: 'user', content: text });

            userInput.value = '';
            userInput.style.height = 'auto';

            // Yükleniyor Mesajı
            const loadingId = appendLoading();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await res.json();
                removeLoading(loadingId);

                if (data.reply) {
                    appendAssistantMessage(data.reply);
                    chatHistory.push({ role: 'assistant', content: data.reply });

                    if (ttsEnabled) speakText(data.reply);
                } else {
                    appendAssistantMessage("Bir hata oluştu. Lütfen tekrar deneyin.");
                }
            } catch (err) {
                removeLoading(loadingId);
                appendAssistantMessage("Sunucuya bağlanılamadı.");
            }
        }

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = "flex justify-end";
            div.innerHTML = `
                <div class="bg-gptHover text-zinc-100 max-w-[80%] px-4 py-3 rounded-2xl rounded-tr-sm text-sm">
                    ${escapeHtml(text)}
                </div>
            `;
            messageList.appendChild(div);
            scrollToBottom();
        }

        function appendAssistantMessage(text) {
            const div = document.createElement('div');
            div.className = "flex gap-4 items-start";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shrink-0 shadow-md">
                    <i class="fa-solid fa-planet text-zinc-950 text-sm"></i>
                </div>
                <div class="flex-1 text-zinc-200 text-sm markdown-body leading-relaxed">
                    ${marked.parse(text)}
                </div>
            `;
            messageList.appendChild(div);
            scrollToBottom();
        }

        function appendLoading() {
            const id = 'load-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex gap-4 items-start";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-planet text-zinc-950 text-sm animate-spin"></i>
                </div>
                <div class="flex items-center gap-1.5 py-2">
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                </div>
            `;
            messageList.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*>?/gm, '').replace(/[\*\_~`]/g, '');
            const ut = new SpeechSynthesisUtterance(clean);
            ut.lang = 'tr-TR';
            window.speechSynthesis.speak(ut);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (s) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
            });
        }
    </script>
</body>
</html>
