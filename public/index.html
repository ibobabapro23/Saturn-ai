<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn AI - Hasan Günbeyi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon Seti -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- Marked.js (Markdown Desteği) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gptBg: '#121318',
                        gptSidebar: '#0b0c0f',
                        gptHover: '#1c1e24',
                        gptInput: '#1a1c23',
                        saturnAmber: '#f59e0b'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #121318;
            color: #ececec;
        }

        /* Özel Kaydırma Çubuğu */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #2a2d37;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f4352;
        }

        /* ================= ANİMASYONLAR ================= */

        /* Yeni Mesaj Gelme Animasyonu (Slide Up + Fade In) */
        @keyframes msgSlideUp {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .animate-msg {
            animation: msgSlideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Saturn Logosunun Derin Nefes/Parlama Efekti */
        @keyframes orbitGlow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(245, 158, 11, 0.25), 0 0 30px rgba(245, 158, 11, 0.1);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 25px rgba(245, 158, 11, 0.55), 0 0 50px rgba(245, 158, 11, 0.25);
                transform: scale(1.03);
            }
        }
        .saturn-glow {
            animation: orbitGlow 4s ease-in-out infinite;
        }

        /* Karşılama İkonu Yüzme (Floating) Animasyonu */
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(3deg); }
        }
        .animate-float {
            animation: floatAnim 5s ease-in-out infinite;
        }

        /* Döner Halkalı Saturn İkonu */
        .saturn-icon-box {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .saturn-ring-spin {
            position: absolute;
            width: 140%;
            height: 45%;
            border: 2px solid rgba(245, 158, 11, 0.85);
            border-radius: 50%;
            transform: rotate(-28deg);
            animation: ringRotate 8s linear infinite;
        }
        @keyframes ringRotate {
            0% { transform: rotate(-28deg) scale(0.96); }
            50% { transform: rotate(-28deg) scale(1.05); }
            100% { transform: rotate(-28deg) scale(0.96); }
        }

        /* Sesli Konuşma Dalga Efekti */
        .voice-wave span {
            display: inline-block;
            width: 3px;
            height: 12px;
            background-color: #f59e0b;
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
        }
        .voice-wave span:nth-child(2) { animation-delay: 0.2s; }
        .voice-wave span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 100% { height: 6px; }
            50% { height: 16px; }
        }

        /* Markdown Biçimlendirmeleri */
        .markdown-body p { margin-bottom: 0.8rem; line-height: 1.65; }
        .markdown-body p:last-child { margin-bottom: 0; }
        .markdown-body ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.8rem; }
        .markdown-body ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.8rem; }
        .markdown-body pre {
            background-color: #08090b !important;
            border-radius: 10px;
            padding: 1rem;
            margin: 0.8rem 0;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .markdown-body code {
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
        }
    </style>
</head>
<body class="h-screen w-screen flex overflow-hidden">

    <!-- SOL KENAR ÇUBUĞU (SIDEBAR) -->
    <aside id="sidebar" class="w-64 bg-gptSidebar flex flex-col justify-between p-3 border-r border-white/5 transition-all duration-300 ease-in-out z-20 shrink-0">
        <div class="flex flex-col gap-2">
            
            <!-- Yeni Sohbet Butonu -->
            <button id="newChatBtn" class="flex items-center justify-between w-full px-3.5 py-3 rounded-xl text-sm text-zinc-200 hover:bg-gptHover transition-all duration-200 border border-white/10 shadow-sm active:scale-95 group">
                <div class="flex items-center gap-2.5">
                    <i class="fa-solid fa-plus text-amber-400 group-hover:rotate-90 transition-transform duration-300"></i>
                    <span class="font-medium">Yeni Sohbet</span>
                </div>
                <span class="text-[10px] bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded border border-white/5">Ctrl+K</span>
            </button>

            <!-- Geçmiş Liste Başlığı -->
            <div class="mt-4 px-2 flex items-center justify-between text-xs font-semibold text-zinc-500 uppercase tracking-wider">
                <span>Sohbetler</span>
                <i class="fa-solid fa-clock-rotate-left text-[10px]"></i>
            </div>

            <!-- Geçmiş Listesi -->
            <div id="chatHistoryList" class="flex flex-col gap-1 overflow-y-auto max-h-[calc(100vh-190px)] pr-1">
                <button class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm text-zinc-300 hover:bg-gptHover transition-all duration-200 text-left truncate w-full group border border-transparent hover:border-white/5">
                    <i class="fa-regular fa-message text-amber-500/70 group-hover:text-amber-400 transition-colors"></i>
                    <span class="truncate">Saturn AI Genel Sohbet</span>
                </button>
            </div>
        </div>

        <!-- Kullanıcı / Geliştirici Bilgisi -->
        <div class="pt-3 border-t border-white/5 flex items-center justify-between px-2">
            <div class="flex items-center gap-3">
                <div class="relative w-9 h-9 rounded-xl bg-gradient-to-tr from-amber-600 via-amber-500 to-amber-300 flex items-center justify-center font-bold text-zinc-950 text-xs shadow-lg shadow-amber-500/20 active:scale-95 transition-transform">
                    HG
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 border-2 border-gptSidebar rounded-full"></span>
                </div>
                <div class="flex flex-col">
                    <span class="text-sm font-semibold text-zinc-200">Hasan Günbeyi</span>
                    <span class="text-[11px] text-amber-400/90 font-medium">Geliştirici & Mimar</span>
                </div>
            </div>
        </div>
    </aside>

    <!-- SAĞ ANA İÇERİK ALANI -->
    <main class="flex-1 flex flex-col h-full bg-gptBg relative overflow-hidden">

        <!-- ÜST BAR (HEADER) -->
        <header class="h-14 px-4 flex items-center justify-between border-b border-white/5 bg-gptBg/80 backdrop-blur-md z-10 shrink-0">
            <div class="flex items-center gap-3">
                <button id="toggleSidebar" class="p-2 text-zinc-400 hover:text-white rounded-xl hover:bg-gptHover transition-all duration-200 active:scale-90">
                    <i class="fa-solid fa-bars-staggered"></i>
                </button>
                <div class="flex items-center gap-2.5">
                    <div class="saturn-icon-box">
                        <i class="fa-solid fa-planet text-amber-400 text-lg"></i>
                        <div class="saturn-ring-spin"></div>
                    </div>
                    <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-amber-300 via-amber-400 to-amber-500 bg-clip-text text-transparent">Saturn AI</span>
                    <span class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20">v3.1 Pro</span>
                </div>
            </div>

            <!-- Ses Göstergesi ve TTS Ayarı -->
            <div class="flex items-center gap-3">
                <div id="speakingIndicator" class="hidden flex items-center gap-2 text-xs text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20">
                    <div class="voice-wave">
                        <span></span><span></span><span></span>
                    </div>
                    <span class="text-[11px] font-medium">Okunuyor</span>
                </div>

                <button id="ttsToggleBtn" title="Sesli Yanıtı Aç/Kapat" class="p-2 text-zinc-400 hover:text-amber-400 rounded-xl hover:bg-gptHover transition-all duration-200">
                    <i id="ttsIcon" class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </header>

        <!-- SOHBET AKIŞ ALANI -->
        <div id="chatContainer" class="flex-1 overflow-y-auto px-4 py-6 scroll-smooth">
            <div class="max-w-3xl mx-auto space-y-6">

                <!-- KARŞILAMA EKRANI (Boş Sohbet Durumu) -->
                <div id="welcomeScreen" class="flex flex-col items-center justify-center min-h-[65vh] text-center space-y-6 transition-all duration-500">
                    
                    <!-- Yüzen Saturn Logosu -->
                    <div class="relative animate-float">
                        <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-amber-600 via-amber-500 to-amber-300 flex items-center justify-center saturn-glow shadow-2xl">
                            <i class="fa-solid fa-planet text-4xl text-zinc-950"></i>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <h2 class="text-2xl md:text-3xl font-bold text-zinc-100 tracking-tight">Bugün sana nasıl yardımcı olabilirim?</h2>
                        <p class="text-sm text-zinc-400 max-w-md mx-auto leading-relaxed">
                            <strong class="text-amber-400 font-semibold">Hasan Günbeyi</strong> tarafından geliştirilen Saturn AI ile kod yazabilir, matematiksel işlemler yapabilir ve fikir alışverişinde bulunabilirsiniz.
                        </p>
                    </div>

                    <!-- Örnek İpuçları (Kartlar) -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 w-full max-w-xl pt-2">
                        <button onclick="sendPrompt('Seni kim geliştirdi ve yeteneklerin nelerdir?')" class="p-3.5 text-left bg-zinc-900/60 hover:bg-gptHover border border-white/5 hover:border-amber-500/30 rounded-2xl text-xs text-zinc-300 transition-all duration-300 hover:-translate-y-1 group shadow-lg">
                            <div class="flex items-center gap-2 mb-1">
                                <i class="fa-solid fa-user-astronaut text-amber-400 group-hover:scale-110 transition-transform"></i>
                                <span class="font-semibold text-amber-400">Geliştirici Hakkında</span>
                            </div>
                            Seni kim geliştirdi ve ne amaçla tasarlandın?
                        </button>

                        <button onclick="sendPrompt('15 × 8 ÷ 3 işleminin sonucunu adım adım göster.')" class="p-3.5 text-left bg-zinc-900/60 hover:bg-gptHover border border-white/5 hover:border-amber-500/30 rounded-2xl text-xs text-zinc-300 transition-all duration-300 hover:-translate-y-1 group shadow-lg">
                            <div class="flex items-center gap-2 mb-1">
                                <i class="fa-solid fa-calculator text-amber-400 group-hover:scale-110 transition-transform"></i>
                                <span class="font-semibold text-amber-400">Matematik İşlemi</span>
                            </div>
                            15 × 8 ÷ 3 işleminin sonucunu adım adım çöz.
                        </button>
                    </div>
                </div>

                <!-- Mesajlar Buraya Dinamik Eklenir -->
                <div id="messageList" class="space-y-6 hidden"></div>

            </div>
        </div>

        <!-- ALT MESAJA GİRİŞ ALANI (CHATGPT STYLE INPUT) -->
        <footer class="p-4 bg-gptBg border-t border-white/5 shrink-0">
            <div class="max-w-3xl mx-auto space-y-2">
                <div class="relative flex items-end bg-gptInput border border-white/10 rounded-2xl p-2 shadow-2xl focus-within:border-amber-500/50 focus-within:ring-2 focus-within:ring-amber-500/20 transition-all duration-300">
                    
                    <!-- Sesli Giriş (Mikrofon) -->
                    <button id="micBtn" title="Sesli Konuş" class="p-3 text-zinc-400 hover:text-amber-400 rounded-xl hover:bg-zinc-800/60 transition-all duration-200 shrink-0 mb-0.5">
                        <i id="micIcon" class="fa-solid fa-microphone text-base"></i>
                    </button>

                    <!-- Textarea Girdi Kutusu -->
                    <textarea id="userInput" rows="1" placeholder="Saturn AI'a bir şeyler sorun..."
                        class="w-full bg-transparent text-zinc-100 px-3 py-2.5 focus:outline-none resize-none text-sm placeholder-zinc-500 max-h-36 leading-relaxed"></textarea>

                    <!-- Gönder Butonu -->
                    <button id="sendBtn" class="p-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-zinc-950 font-bold rounded-xl transition-all duration-200 shrink-0 shadow-lg shadow-amber-500/20 active:scale-90 mb-0.5">
                        <i class="fa-solid fa-arrow-up text-base"></i>
                    </button>
                </div>

                <!-- Alt Dipnot -->
                <p class="text-[11px] text-center text-zinc-500 tracking-wide">
                    Saturn AI hata yapabilir. • <span class="text-zinc-400">Hasan Günbeyi</span>
                </p>
            </div>
        </footer>

    </main>

    <script>
        // DOM Elemanları
        const sidebar = document.getElementById('sidebar');
        const toggleSidebar = document.getElementById('toggleSidebar');
        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageList = document.getElementById('messageList');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const ttsToggleBtn = document.getElementById('ttsToggleBtn');
        const ttsIcon = document.getElementById('ttsIcon');
        const speakingIndicator = document.getElementById('speakingIndicator');
        const newChatBtn = document.getElementById('newChatBtn');

        let chatHistory = [];
        let ttsEnabled = true;
        let isRecognizing = false;
        let recognition = null;

        // Sidebar Aç/Kapat
        toggleSidebar.addEventListener('click', () => {
            sidebar.classList.toggle('-ml-64');
        });

        // Metin Kutusu Otomatik Yükseklik Ayarı
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Speech Recognition (Sesli Konuşma)
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';

            recognition.onstart = () => {
                isRecognizing = true;
                micIcon.className = "fa-solid fa-circle-stop text-red-500 animate-pulse";
            };

            recognition.onend = () => {
                isRecognizing = false;
                micIcon.className = "fa-solid fa-microphone text-zinc-400";
            };

            recognition.onresult = (e) => {
                userInput.value = e.results[0][0].transcript;
                sendMessage();
            };

            micBtn.addEventListener('click', () => {
                if (isRecognizing) recognition.stop();
                else recognition.start();
            });
        } else {
            micBtn.style.display = 'none';
        }

        // Text-to-Speech Toggle
        ttsToggleBtn.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            ttsIcon.className = ttsEnabled ? "fa-solid fa-volume-high text-amber-400" : "fa-solid fa-volume-xmark text-zinc-500";
            if (!ttsEnabled) {
                window.speechSynthesis.cancel();
                speakingIndicator.classList.add('hidden');
            }
        });

        // Yeni Sohbet
        newChatBtn.addEventListener('click', () => {
            chatHistory = [];
            messageList.innerHTML = '';
            messageList.classList.add('hidden');
            welcomeScreen.classList.remove('hidden');
        });

        // Enter ile Gönder
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        function sendPrompt(text) {
            userInput.value = text;
            sendMessage();
        }

        // Mesaj Gönderimi
        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            if (welcomeScreen.classList.contains('hidden') === false) {
                welcomeScreen.classList.add('hidden');
                messageList.classList.remove('hidden');
            }

            // Kullanıcı Mesajını Ekle
            appendUserMessage(text);
            chatHistory.push({ role: 'user', content: text });

            userInput.value = '';
            userInput.style.height = 'auto';

            // Yükleniyor Mesajı
            const loadingId = appendLoading();

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await res.json();
                removeLoading(loadingId);

                if (data.reply) {
                    appendAssistantMessage(data.reply);
                    chatHistory.push({ role: 'assistant', content: data.reply });

                    if (ttsEnabled) speakText(data.reply);
                } else {
                    appendAssistantMessage("Bir hata oluştu. Lütfen tekrar deneyin.");
                }
            } catch (err) {
                removeLoading(loadingId);
                appendAssistantMessage("Sunucuya bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.");
            }
        }

        function appendUserMessage(text) {
            const div = document.createElement('div');
            div.className = "flex justify-end animate-msg";
            div.innerHTML = `
                <div class="bg-amber-500/10 border border-amber-500/20 text-zinc-100 max-w-[85%] px-4 py-3 rounded-2xl rounded-tr-sm text-sm shadow-md">
                    ${escapeHtml(text)}
                </div>
            `;
            messageList.appendChild(div);
            scrollToBottom();
        }

        function appendAssistantMessage(text) {
            const div = document.createElement('div');
            div.className = "flex gap-3.5 items-start animate-msg";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shrink-0 shadow-lg shadow-amber-500/20 mt-0.5">
                    <i class="fa-solid fa-planet text-zinc-950 text-sm"></i>
                </div>
                <div class="flex-1 text-zinc-200 text-sm markdown-body leading-relaxed bg-zinc-900/40 p-4 rounded-2xl rounded-tl-sm border border-white/5 shadow-inner">
                    ${marked.parse(text)}
                </div>
            `;
            messageList.appendChild(div);
            scrollToBottom();
        }

        function appendLoading() {
            const id = 'load-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = "flex gap-3.5 items-start animate-msg";
            div.innerHTML = `
                <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-amber-600 to-amber-400 flex items-center justify-center shrink-0 shadow-lg shadow-amber-500/20 mt-0.5">
                    <i class="fa-solid fa-planet text-zinc-950 text-sm animate-spin"></i>
                </div>
                <div class="flex items-center gap-1.5 py-3 px-4 bg-zinc-900/40 rounded-2xl border border-white/5">
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                </div>
            `;
            messageList.appendChild(div);
            scrollToBottom();
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const clean = text.replace(/<[^>]*>?/gm, '').replace(/[\*\_~`]/g, '');
            const ut = new SpeechSynthesisUtterance(clean);
            ut.lang = 'tr-TR';
            
            ut.onstart = () => speakingIndicator.classList.remove('hidden');
            ut.onend = () => speakingIndicator.classList.add('hidden');

            window.speechSynthesis.speak(ut);
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function (s) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
            });
        }
    </script>
</body>
</html>
