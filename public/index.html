<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saturn AI - Hasan Günbeyi</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon Seti -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Fira Code -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }

        /* Saturn Gezegen Animasyonu */
        .saturn-container {
            position: relative;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .saturn-planet {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
            position: relative;
            z-index: 2;
        }

        .saturn-ring {
            position: absolute;
            width: 42px;
            height: 12px;
            border: 3px solid rgba(251, 191, 36, 0.8);
            border-radius: 50%;
            transform: rotate(-25deg);
            z-index: 1;
            box-shadow: 0 0 10px rgba(251, 191, 36, 0.4);
            animation: ringPulse 3s infinite alternate;
        }

        @keyframes ringPulse {
            0% { transform: rotate(-25deg) scale(0.95); opacity: 0.8; }
            100% { transform: rotate(-25deg) scale(1.05); opacity: 1; }
        }

        /* Cam Efekti (Glassmorphism) */
        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Özel Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }

        /* Kod Blokları Biçimlendirme */
        pre {
            background: #090d16 !important;
            border-radius: 8px;
            padding: 12px;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-family: 'Fira Code', monospace;
            font-size: 0.875rem;
            margin-top: 8px;
            margin-bottom: 8px;
            position: relative;
        }
        code {
            font-family: 'Fira Code', monospace;
        }

        /* Ses Dalgası Animasyonu */
        .speaking-wave {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            height: 16px;
        }
        .speaking-wave span {
            width: 3px;
            height: 100%;
            background-color: #f59e0b;
            border-radius: 3px;
            animation: wave 1.2s ease-in-out infinite;
        }
        .speaking-wave span:nth-child(2) { animation-delay: 0.2s; }
        .speaking-wave span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden">

    <!-- ÜST BAŞLIK (HEADER) -->
    <header class="glass-panel px-6 py-4 flex items-center justify-between z-10 shadow-lg">
        <div class="flex items-center gap-3">
            <div class="saturn-container">
                <div class="saturn-planet"></div>
                <div class="saturn-ring"></div>
            </div>
            <div>
                <h1 class="font-bold text-xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-amber-400 via-amber-200 to-amber-500">
                    Saturn AI
                </h1>
                <p class="text-xs text-slate-400 font-medium">Hasan Günbeyi tarafından geliştirildi</p>
            </div>
        </div>

        <!-- SAĞ MENÜ (Sesli Okuma Butonu) -->
        <div class="flex items-center gap-3">
            <div id="speakingIndicator" class="hidden flex items-center gap-2 text-xs text-amber-400 mr-2">
                <div class="speaking-wave">
                    <span></span><span></span><span></span>
                </div>
                <span>Okunuyor...</span>
            </div>

            <button id="ttsToggleBtn" title="Sesli Yanıtı Aç/Kapat" class="p-2.5 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-amber-400 transition-all border border-slate-700">
                <i id="ttsIcon" class="fa-solid fa-volume-high"></i>
            </button>
        </div>
    </header>

    <!-- SOHBET ALANI -->
    <main id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl mx-auto w-full">
        <!-- KARŞILAMA MESAJI -->
        <div class="flex items-start gap-3">
            <div class="saturn-container shrink-0 mt-1">
                <div class="saturn-planet"></div>
                <div class="saturn-ring"></div>
            </div>
            <div class="glass-panel p-4 rounded-2xl rounded-tl-none max-w-[85%] text-slate-200 border border-slate-800">
                <p class="font-medium text-amber-400 mb-1 text-sm">Saturn AI</p>
                <p class="text-sm leading-relaxed">
                    Merhaba! Ben **Saturn AI**. Sana nasıl yardımcı olabilirim?
                </p>
            </div>
        </div>
    </main>

    <!-- ALT GİRİŞ ALANI (INPUT) -->
    <footer class="p-4 glass-panel border-t border-slate-800 z-10">
        <div class="max-w-4xl mx-auto flex items-center gap-2">
            <!-- MİKROFON BUTONU -->
            <button id="micBtn" title="Sesle Konuş" class="p-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-amber-400 transition-all border border-slate-700 shrink-0">
                <i id="micIcon" class="fa-solid fa-microphone"></i>
            </button>

            <!-- METİN GİRDİ ALANI -->
            <textarea id="userInput" rows="1" placeholder="Saturn AI'a bir şeyler sorun..." 
                class="flex-1 bg-slate-900/90 text-slate-100 rounded-xl px-4 py-3 border border-slate-700 focus:outline-none focus:border-amber-500/80 resize-none max-h-32 text-sm placeholder-slate-500"></textarea>

            <!-- GÖNDER BUTONU -->
            <button id="sendBtn" class="p-3 rounded-xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-bold transition-all shadow-lg shadow-amber-500/20 shrink-0">
                <i class="fa-solid fa-paper-plane text-base"></i>
            </button>
        </div>
    </footer>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        // DOM Elemanları
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const ttsToggleBtn = document.getElementById('ttsToggleBtn');
        const ttsIcon = document.getElementById('ttsIcon');
        const speakingIndicator = document.getElementById('speakingIndicator');

        // Durum Değişkenleri
        let chatHistory = [];
        let ttsEnabled = true;
        let isRecognizing = false;
        let recognition = null;

        // Web Speech API (Ses Tanıma) Kurulumu
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'tr-TR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecognizing = true;
                micBtn.classList.add('bg-red-600', 'text-white', 'animate-pulse');
                micBtn.classList.remove('bg-slate-800', 'text-slate-300');
            };

            recognition.onend = () => {
                isRecognizing = false;
                micBtn.classList.remove('bg-red-600', 'text-white', 'animate-pulse');
                micBtn.classList.add('bg-slate-800', 'text-slate-300');
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                sendMessage();
            };
        } else {
            micBtn.style.display = 'none';
        }

        // Sesli Okuma (TTS) Açma/Kapatma
        ttsToggleBtn.addEventListener('click', () => {
            ttsEnabled = !ttsEnabled;
            if (ttsEnabled) {
                ttsIcon.className = "fa-solid fa-volume-high";
                ttsToggleBtn.classList.remove('opacity-50');
            } else {
                ttsIcon.className = "fa-solid fa-volume-xmark";
                ttsToggleBtn.classList.add('opacity-50');
                window.speechSynthesis.cancel();
                speakingIndicator.classList.add('hidden');
            }
        });

        // Sesli Mesaj Butonu
        micBtn.addEventListener('click', () => {
            if (!recognition) return;
            if (isRecognizing) {
                recognition.stop();
            } else {
                recognition.start();
            }
        });

        // Mesaj Alanı Otomatik Boyutlandırma
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Enter ile Gönderme
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // Mesaj Gönderme Fonksiyonu
        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Kullanıcı Mesajını Ekrana Ekle
            appendMessage('user', message);
            userInput.value = '';
            userInput.style.height = 'auto';

            // Sohbet Geçmişine Ekle
            chatHistory.push({ role: 'user', content: message });

            // Yükleniyor Göstergesi
            const loadingId = appendLoading();

            try {
                // Node.js Backend API'sine İstek Atıyoruz
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (data.reply) {
                    appendMessage('assistant', data.reply);
                    chatHistory.push({ role: 'assistant', content: data.reply });

                    // Sesli Okuma Yap
                    if (ttsEnabled) {
                        speakText(data.reply);
                    }
                } else {
                    appendMessage('assistant', 'Bir hata oluştu: Yanıt alınamadı.');
                }

            } catch (error) {
                removeLoading(loadingId);
                appendMessage('assistant', 'Sunucu ile bağlantı kurulamadı. Lütfen sunucunuzun çalıştığından emin olun.');
            }
        }

        // Ekrana Mesaj Ekleme
        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'flex items-start gap-3 ' + (role === 'user' ? 'justify-end' : '');

            if (role === 'user') {
                msgDiv.innerHTML = `
                    <div class="bg-amber-500/20 border border-amber-500/30 p-4 rounded-2xl rounded-tr-none max-w-[85%] text-slate-100">
                        <p class="font-medium text-amber-400 mb-1 text-xs text-right">Siz</p>
                        <p class="text-sm leading-relaxed">${escapeHtml(text)}</p>
                    </div>
                `;
            } else {
                const parsedText = marked.parse(text);
                msgDiv.innerHTML = `
                    <div class="saturn-container shrink-0 mt-1">
                        <div class="saturn-planet"></div>
                        <div class="saturn-ring"></div>
                    </div>
                    <div class="glass-panel p-4 rounded-2xl rounded-tl-none max-w-[85%] text-slate-200 border border-slate-800">
                        <p class="font-medium text-amber-400 mb-1 text-xs">Saturn AI</p>
                        <div class="text-sm leading-relaxed">${parsedText}</div>
                    </div>
                `;
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Yükleniyor Animasyonu
        function appendLoading() {
            const id = 'loading-' + Date.now();
            const loadDiv = document.createElement('div');
            loadDiv.id = id;
            loadDiv.className = 'flex items-start gap-3';
            loadDiv.innerHTML = `
                <div class="saturn-container shrink-0 mt-1">
                    <div class="saturn-planet"></div>
                    <div class="saturn-ring"></div>
                </div>
                <div class="glass-panel p-4 rounded-2xl rounded-tl-none border border-slate-800 flex items-center gap-2">
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce"></div>
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce [animation-delay:-0.15s]"></div>
                    <div class="w-2 h-2 bg-amber-400 rounded-full animate-bounce [animation-delay:-0.3s]"></div>
                </div>
            `;
            chatContainer.appendChild(loadDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        // Metni Türkçe Seslendirme (Text-to-Speech)
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel(); // Önceki sesleri durdur
            
            // HTML etiketlerini ve markdown işaretlerini temizle
            const cleanText = text.replace(/<[^>]*>?/gm, '').replace(/[\*\_~`]/g, '');

            const utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'tr-TR';
            utterance.rate = 1.0;

            utterance.onstart = () => {
                speakingIndicator.classList.remove('hidden');
            };

            utterance.onend = () => {
                speakingIndicator.classList.add('hidden');
            };

            window.speechSynthesis.speak(utterance);
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }
    </script>
</body>
</html>
